<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitFace Storage Migration</title>
</head>
<body>
<script>
  (function () {
    var allowedOrigins = [
      "https://gitface.dilip.website",
      "https://dilip.website",
      "http://localhost:3000"
    ];

    function isAllowed(origin) {
      return allowedOrigins.indexOf(origin) !== -1;
    }

    function sendData(targetOrigin) {
      try {
        var config = localStorage.getItem("gitface-readme-config");
        var theme = localStorage.getItem("gitface-theme");
        window.parent.postMessage(
          {
            type: "GITFACE_STORAGE_DATA",
            config: config,
            theme: theme
          },
          targetOrigin
        );
      } catch (err) {
        window.parent.postMessage(
          {
            type: "GITFACE_STORAGE_ERROR",
            error: String(err)
          },
          targetOrigin
        );
      }
    }

    window.addEventListener("message", function (event) {
      if (!isAllowed(event.origin)) return;
      if (event.data && event.data.type === "REQUEST_GITFACE_STORAGE") {
        sendData(event.origin);
      }
    });

    // Notify parent listener that migration helper is ready
    allowedOrigins.forEach(function (origin) {
      try {
        window.parent.postMessage({ type: "GITFACE_MIGRATION_READY" }, origin);
      } catch (e) {}
    });
  })();
</script>
</body>
</html>
